<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Iron Meridian playtest</title>
<style>
:root{--bg:#f3efe3;--card:#fffaf0;--ink:#1d1d1d;--mut:#6b6558;--line:#d9d1bd;--pri:#1b6ec2;--sea:#d6e6f2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;gap:8px;align-items:center;padding:6px 10px;background:#22392d;color:#f5ebd3;min-width:0}
#round{font-size:12px;opacity:.8;white-space:nowrap}
#cash{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1 1 auto}
.cc{flex:1 1 0;min-width:0;max-width:200px;justify-content:space-between;display:flex;align-items:baseline;gap:4px;background:#fff1;border:2px solid #888;border-radius:8px;padding:2px 6px;white-space:nowrap}
@media (max-width:520px){#round{display:none}}
.cc.on{background:#fff;color:#111}.cc b{font-size:16px;overflow:hidden;text-overflow:ellipsis}.cc span{font-size:15px;font-weight:800}.cc span.neg{color:#d33}
.gear{font-size:24px;line-height:1;width:40px;height:36px;border:1px solid #fff6;background:#fff2;color:#f5ebd3;border-radius:8px;cursor:pointer}
.setl{display:flex;flex-direction:column;gap:10px;margin:10px 0}.setl label{display:flex;align-items:center;gap:8px;font-size:14px}
.rgroup{margin:4px 0;border:1px solid var(--line);border-radius:6px;background:#fff}.rgroup>summary{cursor:pointer;padding:5px 8px;font-weight:700;font-size:13px;list-style:none}
.rgroup>summary::before{content:"\25B8  ";}
.rgroup .rt{margin:0 4px 4px;width:calc(100% - 8px)}
#railsec>summary{cursor:pointer;font-weight:800;font-size:15px}
#pipbox{position:absolute;right:8px;top:8px;background:#fffbe8;border:3px solid #c0392b;border-radius:12px;padding:4px 12px;text-align:center;box-shadow:0 2px 8px #0005;pointer-events:none;line-height:1}
#pipbox b{display:block;font-size:40px;color:#c0392b}
#pipbox span{font-size:12px;color:#555;display:block;margin:2px 0}
#main.animfull #side{display:none!important}
#main.animfull #mapwrap{flex:1 1 100%!important}
#rollov{position:absolute;inset:0;z-index:30;background:rgba(15,25,20,.55);display:flex;align-items:center;justify-content:center;cursor:pointer}
#rollov[hidden]{display:none}
.rbox{background:#f5ecd4;border:3px solid #22392d;border-radius:16px;padding:16px 24px;text-align:center;box-shadow:0 8px 30px #0008;max-width:92%}
#rt1{font-weight:800;font-size:17px;margin-bottom:10px}
#rdice{display:flex;gap:18px;justify-content:center;margin:6px 0 12px}
#rdice .die{width:84px;height:84px;position:relative;padding:0;cursor:default}
#rt2{font-size:19px;font-weight:800;color:#1b6ec2;min-height:26px}
.rbox .sk{font-size:11px;color:#777;margin-top:6px}
.luc{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);z-index:48;text-align:center;background:#fffbe8;border:5px solid #c0392b;border-radius:18px;padding:16px 30px;box-shadow:0 12px 60px #000b;max-width:88%;cursor:pointer;animation:lucin .6s cubic-bezier(.2,1.4,.4,1),lucshake .5s .6s 2}
.luc .lu1{font-size:64px;font-weight:900;letter-spacing:4px;color:#c0392b;text-shadow:3px 3px 0 #0003,-1px -1px 0 #fff;transform:rotate(-3deg);margin-bottom:6px}
.luc .lu2{font-size:19px;line-height:1.45}
@keyframes lucin{0%{opacity:0;transform:translate(-50%,-50%) scale(.1) rotate(-25deg)}100%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes lucshake{0%,100%{margin-left:0}25%{margin-left:-9px}75%{margin-left:9px}}
.em{position:absolute;top:-30px;font-size:30px;z-index:47;pointer-events:none;font-style:normal;opacity:0;animation:cfall 3.2s ease-in forwards}
@media (max-width:520px){.luc .lu1{font-size:38px}.luc{padding:12px 16px}.luc .lu2{font-size:15px}}
.cc.bank{flex:0 0 auto;max-width:none;border-color:#c9a227;gap:5px}.cc.bank b{font-size:14px}
@media (max-width:520px){.cc.bank b{display:none}}
.coin{position:fixed;left:0;top:0;z-index:120;pointer-events:none;display:flex;align-items:center;gap:3px;padding:2px 10px 2px 6px;border-radius:22px;font-weight:900;font-size:17px;color:#4a3200;background:radial-gradient(circle at 30% 30%,#fff1a8,#ffc928 60%,#c99700);border:3px solid #9a7200;box-shadow:0 4px 10px #0007;opacity:0}
.coin.tobank{background:radial-gradient(circle at 30% 30%,#ffd0cc,#ff6d62 60%,#b83228);border-color:#8a1f18;color:#fff}
.coin.frombank,.coin.p2p{ }
.coin.frombank{background:radial-gradient(circle at 30% 30%,#d4ffd0,#5ed36a 60%,#2a8a34);border-color:#1b6b24;color:#fff}
.coin span{font-size:20px}
.cc.bump-in{animation:bumpin .8s}.cc.bump-out{animation:bumpout .8s}
@keyframes bumpin{0%,100%{box-shadow:0 0 0 0 #18862f00;transform:none}35%{box-shadow:0 0 0 6px #18862fcc,0 0 18px #3ddc5a;transform:scale(1.12)}}
@keyframes bumpout{0%,100%{box-shadow:0 0 0 0 #c0392b00;transform:none}35%{box-shadow:0 0 0 6px #c0392bcc,0 0 18px #ff6d62;transform:scale(.94)}}
#era{position:absolute;right:8px;bottom:8px;z-index:12;display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#fff6d2,#f1dc99);border:3px solid #9a7200;border-radius:10px;padding:3px 10px 3px 6px;box-shadow:0 3px 10px #0005;pointer-events:none;opacity:.96}
#era b{display:block;font-size:14px;color:#3a2a00;white-space:nowrap}#era span{font-size:11px;color:#6b4e00;white-space:nowrap}
@media (max-width:520px){#era{transform:scale(.82);transform-origin:right bottom}}
.pad{border:2px solid var(--line);border-radius:10px;background:#fff;padding:6px 8px}
.padtitle{font-weight:800;margin-bottom:2px}.padrow{display:flex;align-items:center;gap:4px;margin:4px 0}.padlab{width:78px;font-size:12px;color:var(--mut);flex:none}
.pb{flex:1;padding:2px;border:2px solid #8a8370;border-radius:9px;background:#fff;cursor:pointer;display:flex;justify-content:center}
.pb .pd{margin:0;width:100%;max-width:38px;height:auto;aspect-ratio:1;animation:none}.pd.still{animation:none}
.pb.sel{border-color:var(--pri);background:#e8f1fb;box-shadow:0 0 0 3px var(--pri)}
.padhint{min-height:22px;font-size:15px;margin:4px 0}.pad .b.big{margin-top:2px}.pad .b:disabled{opacity:.45;cursor:default}
#pass{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#fff;text-align:center;padding:20px}
#pass[hidden]{display:none}.pc1{font-size:22px;opacity:.9}.pc2{font-size:64px;font-weight:900;text-shadow:0 3px 0 #0004}#pass .b{max-width:420px;font-size:20px;padding:16px}
#turnbar{color:#fff;border-radius:10px;padding:10px 14px;font-size:20px;text-align:center;box-shadow:0 2px 8px #0003}#turnbar[hidden]{display:none}#turnbar b{font-size:26px}
.shared #side{font-size:16px}.shared .pb .pd{max-width:52px}.shared .padtitle{font-size:19px}.shared .padlab{width:96px;font-size:14px}.shared .b.big{font-size:19px;padding:14px}
@media (min-width:901px){.shared #side{flex-basis:470px}}
.dec{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:48;text-align:center;background:linear-gradient(#f4fff2,#d9f5d3);border:6px solid #2e9e4f;border-radius:20px;padding:12px 26px;box-shadow:0 12px 50px #000a;max-width:90%;cursor:pointer;animation:decin .6s cubic-bezier(.2,1.4,.4,1)}
.dec .dh{font-size:60px;line-height:1;animation:dechop 1s ease-in-out 3}.dec .d1{font-size:38px;font-weight:900;letter-spacing:2px;text-shadow:2px 2px 0 #0002}.dec .d2{font-size:18px;line-height:1.45;margin-top:4px}
@keyframes decin{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes dechop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
.homering{animation:hring 1.1s ease-in-out infinite}@keyframes hring{0%,100%{opacity:.35;stroke-width:5px}50%{opacity:1;stroke-width:10px}}
.winov{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 40%,#fffbe8f0,#f3dc8ae8);text-align:center;padding:16px;animation:winin .7s ease-out}
.winov .wt{font-size:110px;line-height:1;animation:wtrophy 1.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px #0005)}.winov .w1{font-size:60px;font-weight:900;letter-spacing:3px;color:var(--wc,#c0392b);text-shadow:3px 3px 0 #0002,-1px -1px 0 #fff}
.winov .w2{font-size:20px;line-height:1.5;margin-bottom:6px}@keyframes winin{0%{opacity:0}100%{opacity:1}}@keyframes wtrophy{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.12)}}
.fw{transform-box:fill-box;transform-origin:center;animation:fwburst 1.6s ease-out infinite;opacity:0}@keyframes fwburst{0%{transform:scale(.2);opacity:1}100%{transform:scale(6);opacity:0}}
@media (max-width:520px){.winov .w1{font-size:38px}.winov .wt{font-size:80px}.dec .d1{font-size:26px}}
#roombar{background:#e8f1fb;border:2px solid var(--pri);border-radius:10px;padding:6px 10px;font-size:14px}#roombar[hidden]{display:none}
/* corner cards: dice rolls, lucanored and declare-home sit in the top-left corner so the board flashes stay in view */
#rollov{position:absolute;inset:auto;left:8px;top:54px;z-index:30;background:none;display:block;cursor:pointer;max-width:min(300px,70%)}
.rbox{border-width:3px;border-radius:12px;padding:8px 12px;box-shadow:0 4px 16px #0006}
#rt1{font-size:14px;margin-bottom:4px}#rdice{gap:8px;margin:2px 0 6px}#rdice .die{width:56px;height:56px}#rt2{font-size:16px;min-height:20px}.rbox .sk{display:none}
.luc{left:8px;top:54px;transform:none;max-width:min(330px,80%);padding:8px 12px;border-width:4px;text-align:left;box-shadow:0 6px 24px #0007;animation:cornerin .45s cubic-bezier(.2,1.3,.4,1)}
.luc .lu1{font-size:30px;letter-spacing:2px;margin-bottom:2px}.luc .lu2{font-size:14px;line-height:1.35}
.dec{left:8px;top:54px;transform:none;max-width:min(330px,80%);padding:8px 12px;border-width:4px;text-align:left;box-shadow:0 6px 24px #0007;animation:cornerin .45s cubic-bezier(.2,1.3,.4,1)}
.dec .dh{font-size:30px;float:left;margin-right:8px}.dec .d1{font-size:20px;letter-spacing:1px}.dec .d2{font-size:13px;line-height:1.35;margin-top:2px}
@keyframes cornerin{0%{opacity:0;transform:translateX(-40px) scale(.8)}100%{opacity:1;transform:none}}
.railg.owned{display:none}
.mfloat{position:fixed;z-index:100;transform:translateX(-50%);font-weight:900;font-size:22px;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 6px #fff;animation:mflo 2.3s ease-out forwards;opacity:0}
.mfloat.up{color:#18862f}.mfloat.dn{color:#c0392b}
@keyframes mflo{0%{opacity:0;transform:translate(-50%,0) scale(.7)}12%{opacity:1;transform:translate(-50%,6px) scale(1.2)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,46px) scale(1)}}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:26;background:#fffbe8;border:4px solid #22392d;border-radius:14px;padding:10px 18px;max-width:min(560px,92%);text-align:center;font-size:17px;box-shadow:0 6px 24px #0006;cursor:pointer}
#toast[hidden]{display:none}
#toast .gain{color:#18862f;font-weight:900;font-size:20px}
#toast .lu{font-size:30px;font-weight:900;letter-spacing:2px;color:#c0392b;transform:rotate(-2deg);margin-bottom:4px;text-shadow:2px 2px 0 #0002;animation:lupop .5s}
@keyframes lupop{0%{transform:scale(.3) rotate(-14deg)}60%{transform:scale(1.25) rotate(3deg)}100%{transform:scale(1) rotate(-2deg)}}
.six{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);z-index:45;pointer-events:none;font-weight:900;color:#fff;background:#22392d;border-radius:12px;padding:4px 14px;font-size:20px;animation:sixpop 1.6s ease-out forwards}
.six.big{font-size:54px;padding:8px 30px;background:linear-gradient(135deg,#e6194b,#ff8c00);box-shadow:0 8px 40px #000a;letter-spacing:3px;animation:sixbig 2.6s ease-out forwards}
@keyframes sixpop{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
@keyframes sixbig{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(1.25) rotate(3deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(-2deg)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.cf{position:absolute;top:-16px;width:9px;height:15px;z-index:44;pointer-events:none;opacity:0;animation:cfall 2.6s ease-in forwards}
@keyframes cfall{0%{opacity:1;transform:translate(0,0) rotate(0)}100%{opacity:1;transform:translate(var(--dx,0),620px) rotate(720deg)}}
.fxf{animation:fxp .75s ease-in-out 4;pointer-events:none}
@keyframes fxp{0%,100%{opacity:.08}50%{opacity:.8}}
.sb{border-collapse:collapse;width:100%;font-size:13px}
.sb th{font-size:11px;color:var(--mut);text-align:left;padding:0 4px 2px;font-weight:600}
.sb td{padding:3px 4px;border-top:1px solid var(--line);vertical-align:top}
.sb tr.on td{background:#fff3b8}
.sb tr.on td:first-child{box-shadow:inset 4px 0 0 var(--pc)}
.sb .nm b{font-size:15px}.sb .cs{font-weight:800;font-size:15px;white-space:nowrap}.sb .cs.neg{color:#c00}
.sb .muted{font-size:11px;line-height:1.2}
.dicebtn{margin-top:0!important;padding:14px!important;font-size:17px!important}
.trip{margin:6px 0 2px;font-size:13px}
.routebox{margin:4px 0 0!important;padding:6px!important}
.rmrow{display:flex;gap:4px}
.rm{flex:1;display:flex!important;flex-direction:column;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:3px 5px;cursor:pointer;font-size:12px;background:#fff}
.rm.sel{border-color:var(--pri);background:#e8f1fb}.rm input{display:none}.rm .muted{font-size:11px}
.b.sm{padding:1px 8px;font-size:12px}
.hs{font-size:12px;display:inline-flex;gap:4px;align-items:center;margin:4px 0}
header h1{font-size:16px;margin:0}
header .sp{flex:0}
#main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1 1 60%;position:relative;background:var(--sea);min-width:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map text{user-select:none;-webkit-user-select:none;pointer-events:none}
.mapctl{position:absolute;left:8px;top:8px;display:flex;gap:4px}
#qact{position:absolute;right:8px;top:8px;z-index:25;display:flex;flex-direction:column;align-items:flex-end;gap:6px}#qact[hidden]{display:none}
#qact .qb{height:38px;padding:0 14px;font-size:16px;font-weight:700;border:2px solid var(--pri);background:var(--pri);color:#fff;border-radius:19px;cursor:pointer;box-shadow:0 3px 10px #0005}
#qact .qb.sec{height:32px;font-size:14px;background:#fffffff2;color:var(--pri)}
.mapctl button{width:34px;height:34px;font-size:18px;border:1px solid #888;background:#fffe;border-radius:6px;cursor:pointer}
#side{flex:0 0 400px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--bg);border-left:1px solid var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.pl{border-left:6px solid #888;padding:4px 8px;margin-bottom:5px;background:#fff;border-radius:4px}
.pl.on{box-shadow:0 0 0 2px #222;background:#fff7d6}
.pl1{display:flex;align-items:center;gap:6px}.pl1 b{font-size:18px}
.cash{margin-left:auto;font-weight:800;font-size:16px}.cash.neg{color:#c00}
.pl2{color:var(--mut);font-size:12px}
.tag{font-size:10px;background:#ddd;border-radius:3px;padding:0 4px}.tag.sc{background:#ffd400}.tag.home{background:#cfe9cf}
.rc{display:inline-block;border:2px solid #888;border-radius:4px;font-size:11px;font-weight:700;padding:0 3px;margin:1px 2px 1px 0;background:#fff}
.muted{color:var(--mut);font-size:12px}
.b{font:inherit;padding:6px 10px;border:1px solid #8a8370;border-radius:6px;background:#fff;cursor:pointer}
.b:hover{background:#f0ead8}.b.pri{background:var(--pri);color:#fff;border-color:#14538f}.b.pri:hover{background:#155a9e}
.b.big{display:block;width:100%;padding:10px;font-size:15px;margin-top:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.who{margin-bottom:6px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{border-width:3px}
.routebox{margin:6px 0;padding:6px;background:#fff;border:1px solid var(--line);border-radius:6px}
.rm{display:block;margin:2px 0}
.manual{margin-top:6px;padding:4px;background:#fff3;border:1px dashed var(--line)}
.manual input[type=number]{width:60px}
.pd{display:inline-grid;grid-template:repeat(3,1fr)/repeat(3,1fr);width:32px;height:32px;padding:4px;margin:2px 4px 2px 0;background:#fff;border:2px solid #333;border-radius:8px;vertical-align:middle;box-shadow:0 2px 0 #0003;animation:pdroll .8s cubic-bezier(.2,1.3,.4,1)}
.pd i{border-radius:50%;display:block}.pd i.on{background:#222}
.pd.red{background:#c0392b;border-color:#7a1f15}.pd.red i.on{background:#fff}
@keyframes pdroll{0%{transform:rotate(-540deg) scale(.2);opacity:0}55%{transform:rotate(25deg) scale(1.2);opacity:1}100%{transform:none}}
.gd{display:inline-block;font-size:34px;line-height:34px;margin-right:2px;color:#222;animation:pop .35s}
.gd.red{color:#c0392b}
@keyframes pop{from{transform:scale(1.5) rotate(-20deg);opacity:.2}to{transform:none;opacity:1}}
.sum{font-size:13px}
table{border-collapse:collapse;width:100%}
.rt td,.rt th{padding:2px 4px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:middle}
.rt tr.sel td{background:#ffe566}
.rt tr[data-rail]{cursor:pointer}.rt tr[data-rail]:hover{background:#f6efd8}.rt tr.prem td:nth-child(2){font-size:13px}
.own{color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
.buy{padding:1px 8px;font-size:12px;background:#2e9e4f;color:#fff;border-color:#1e7a3a}
.st th,.st td{padding:2px 4px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}
.win{font-size:16px;background:#fff3b0;padding:8px;border-radius:6px;margin-bottom:6px}
#log{max-height:240px;overflow-y:auto}
.lg{border-left:4px solid #ccc;padding:1px 6px;margin-bottom:2px;font-size:12px}
.arr{margin-bottom:4px}
.halo{pointer-events:none}.railg.flash path:last-child{stroke-width:10px}.railg.flash path{filter:drop-shadow(0 0 4px #000)}
#tip{position:absolute;left:8px;bottom:8px;max-width:min(430px,92%);background:#fffbe8;border:2px solid #333;border-radius:8px;padding:8px;box-shadow:0 2px 8px #0006;font-size:13px}
#tip .tt{display:flex;gap:6px;align-items:center;margin-bottom:4px}
#tip .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer}
.big2{display:block;width:100%;margin-top:6px;padding:8px;font-size:14px}
.rc.via{cursor:pointer;background:#ffe27a;border-color:#111}
#tip .rc{cursor:pointer}
.ring{animation:ring .9s ease-out 3}
.pip{animation:pip 0.9s ease-in-out infinite}
@keyframes pip{0%,100%{stroke-width:4px}50%{stroke-width:8px}}
.walk{margin-bottom:4px}.rem{font-size:30px;font-weight:800;color:#c0392b}
@keyframes ring{from{r:12px;opacity:.95}to{r:64px;opacity:0}}
dialog{border:1px solid #666;border-radius:10px;max-width:640px;width:92vw;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog h2{margin-top:0}.rules li{margin-bottom:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.grid label{display:flex;flex-direction:column;font-size:12px}
.pr{display:flex;align-items:center;gap:6px;margin:3px 0}.pr input{flex:1;padding:4px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ld input{display:block;font-size:11px}
@media (max-width:900px){
 #main{flex-direction:column}
 #mapwrap{flex:0 0 52vh}
 #side{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>Iron Meridian</h1><span id="round"></span>
  <div id="bank" class="cc bank" title="The bank: public fees and purchases go here, payoffs come from here"><span>&#127974;</span><b>Bank</b></div><div id="cash"></div>
  <span class="sp"></span>
  <button class="gear" id="gear" title="Settings" aria-label="Settings">&#9881;</button>
 </header>
 <div id="main">
  <section id="mapwrap">
   <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
   <div id="tip" hidden></div>
   <div id="pipbox" hidden></div>
   <div id="toast" hidden></div>
   <div id="era"></div>
   <div id="rollov" hidden><div class="rbox"><div id="rt1"></div><div id="rdice"></div><div id="rt2"></div><div class="sk">tap to skip</div></div></div>
   <div id="qact" hidden></div>
   <div class="mapctl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button><button id="zall" title="Whole map">&#8962;</button><button id="ztight" title="Tight map: playable area only">&#9635;</button><button id="znow" title="Centre on the player">&#9678;</button></div>
  </section>
  <aside id="side">
   <div id="roombar" hidden></div>
   <div id="turnbar" hidden></div>
   <div class="panel" id="players"></div>
   <div class="panel"><div id="actions"></div><div id="dicebox" style="margin-top:6px"></div></div>
   <details class="panel" id="railsec" open><summary>Rails</summary><label class="hs"><input type="checkbox" id="hsold"> Hide sold rails</label> <span class="muted">(tap a row to find it on the map)</span><div id="rails"></div></details>
   <div class="panel"><b>Log</b><div id="log"></div></div>
  </aside>
 </div>
</div>
<div id="pass" hidden></div>
<dialog id="dlg"></dialog>
<dialog id="set"><h2>Settings</h2>
 <div class="setl">
  <label>Bot speed <select id="spd"><option value="120">fast</option><option value="650">normal</option><option value="1300">slow</option></select></label>
  <label><input type="checkbox" id="fol"> Camera follows the player</label>
  <label>Dice speed <select id="dspd"><option value="1">Relaxed</option><option value="0.65">Brisk</option><option value="0.4">Quick</option></select></label>
  <label>Dice <select id="dsel"><option value="digital">Digital (3D dice on screen)</option><option value="real">Real dice (tap what they show)</option></select></label>
  <label>Screen <select id="ssel"><option value="pass">One device passed around</option><option value="shared">One shared screen on the table</option></select></label>
  <label><input type="checkbox" id="stp"> Click each pip to move</label>
  <label><input type="checkbox" id="hm"> Triangles on home cities</label>
  <label><input type="checkbox" id="tg"> Rail codes on the map</label>
  <label>Player colours <select id="pal"><option value="classic">Classic</option><option value="safe">Colour-blind safe</option><option value="bold">Bold</option></select></label>
  <label><input type="checkbox" id="pln"> Owned tracks show only the owner's colour (hide the rail's own stripe)</label>
  <label><input type="checkbox" id="trl"> Keep each player's last move highlighted on the map</label>
  <label><input type="checkbox" id="crd"> Card slots around the board (rail cards; bought ones in the owner's colour)</label>
  <label><input type="checkbox" id="thk"> Owned rails in thick player colour (more room between parallel tracks)</label>
  <label><input type="checkbox" id="tgt"> Tight map (trim the Atlantic and the empty east)</label>
 </div>
 <div class="row"><button class="b pri" id="bnew">New game</button><button class="b" id="bsave">Save file</button><button class="b" id="brules">Rules</button><button class="b" id="setok">Close</button></div>
</dialog>
<script>
/* the era chosen in the New game dialog (saved in this browser) or ?era=1913 decides which map file loads */
(function () { var e = 'classic'; try { var m = location.search.match(/[?&]era=(\w+)/); e = (m && m[1]) || localStorage.getItem('baron.era.v1') || 'classic'; } catch (x) { /* no storage */ }
  if (['classic', '1913'].indexOf(e) < 0) e = 'classic'; document.write('<script src="' + (e === 'classic' ? 'data-eurobaron.js' : 'data-' + e + '.js') + '"><\/script>'); })();
</script>
<script src="engine.js"></script>
<script src="dice3d.js"></script>
<script src="app.js"></script>
</body>
</html>
