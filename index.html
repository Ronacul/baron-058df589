<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Eurobaron playtest</title>
<style>
:root{--bg:#f3efe3;--card:#fffaf0;--ink:#1d1d1d;--mut:#6b6558;--line:#d9d1bd;--pri:#1b6ec2;--sea:#d6e6f2}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 10px;background:#22392d;color:#f5ebd3}
header h1{font-size:16px;margin:0 8px 0 0}
header .sp{flex:1}
header label{font-size:12px;display:flex;align-items:center;gap:4px}
header select{font-size:12px}
#main{flex:1;display:flex;min-height:0}
#mapwrap{flex:1 1 60%;position:relative;background:var(--sea);min-width:0}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#map text{user-select:none;-webkit-user-select:none;pointer-events:none}
.mapctl{position:absolute;left:8px;top:8px;display:flex;gap:4px}
.mapctl button{width:34px;height:34px;font-size:18px;border:1px solid #888;background:#fffe;border-radius:6px;cursor:pointer}
#side{flex:0 0 400px;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px;background:var(--bg);border-left:1px solid var(--line)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px}
.pl{border-left:6px solid #888;padding:4px 8px;margin-bottom:5px;background:#fff;border-radius:4px}
.pl.on{box-shadow:0 0 0 2px #222;background:#fff7d6}
.pl1{display:flex;align-items:center;gap:6px}
.cash{margin-left:auto;font-weight:800;font-size:16px}.cash.neg{color:#c00}
.pl2{color:var(--mut);font-size:12px}
.tag{font-size:10px;background:#ddd;border-radius:3px;padding:0 4px}.tag.sc{background:#ffd400}.tag.home{background:#cfe9cf}
.rc{display:inline-block;border:2px solid #888;border-radius:4px;font-size:11px;font-weight:700;padding:0 3px;margin:1px 2px 1px 0;background:#fff}
.muted{color:var(--mut);font-size:12px}
.b{font:inherit;padding:6px 10px;border:1px solid #8a8370;border-radius:6px;background:#fff;cursor:pointer}
.b:hover{background:#f0ead8}.b.pri{background:var(--pri);color:#fff;border-color:#14538f}.b.pri:hover{background:#155a9e}
.b.big{display:block;width:100%;padding:10px;font-size:15px;margin-top:6px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.who{margin-bottom:6px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:middle}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}.chip{border-width:3px}
.routebox{margin:6px 0;padding:6px;background:#fff;border:1px solid var(--line);border-radius:6px}
.rm{display:block;margin:2px 0}
.manual{margin-top:6px;padding:4px;background:#fff3;border:1px dashed var(--line)}
.manual input[type=number]{width:60px}
.die{display:inline-block;font-size:44px;line-height:44px;margin-right:2px;color:#222;animation:pop .35s}
.die.red{color:#c0392b}
@keyframes pop{from{transform:scale(1.5) rotate(-20deg);opacity:.2}to{transform:none;opacity:1}}
.sum{font-size:13px}
table{border-collapse:collapse;width:100%}
.rt td,.rt th{padding:2px 4px;border-bottom:1px solid var(--line);font-size:12px;text-align:left;vertical-align:middle}
.rt tr[data-rail]{cursor:pointer}.rt tr[data-rail]:hover{background:#f6efd8}.rt tr.prem td:nth-child(2){font-size:13px}
.own{color:#fff;border-radius:4px;padding:1px 6px;font-size:11px;font-weight:700}
.buy{padding:1px 8px;font-size:12px;background:#2e9e4f;color:#fff;border-color:#1e7a3a}
.st th,.st td{padding:2px 4px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}
.win{font-size:16px;background:#fff3b0;padding:8px;border-radius:6px;margin-bottom:6px}
#log{max-height:240px;overflow-y:auto}
.lg{border-left:4px solid #ccc;padding:1px 6px;margin-bottom:2px;font-size:12px}
.arr{margin-bottom:4px}
.halo{pointer-events:none}.railg.flash path:last-child{stroke-width:10px}.railg.flash path{filter:drop-shadow(0 0 4px #000)}
#tip{position:absolute;left:8px;bottom:8px;max-width:min(430px,92%);background:#fffbe8;border:2px solid #333;border-radius:8px;padding:8px;box-shadow:0 2px 8px #0006;font-size:13px}
#tip .tt{display:flex;gap:6px;align-items:center;margin-bottom:4px}
#tip .x{margin-left:auto;border:0;background:none;font-size:22px;line-height:1;cursor:pointer}
.big2{display:block;width:100%;margin-top:6px;padding:8px;font-size:14px}
.rc.via{cursor:pointer;background:#ffe27a;border-color:#111}
#tip .rc{cursor:pointer}
.ring{animation:ring .9s ease-out 3}
.pip{animation:pip 0.9s ease-in-out infinite}
@keyframes pip{0%,100%{stroke-width:4px}50%{stroke-width:8px}}
.walk{margin-bottom:4px}.rem{font-size:30px;font-weight:800;color:#c0392b}
@keyframes ring{from{r:12px;opacity:.95}to{r:64px;opacity:0}}
dialog{border:1px solid #666;border-radius:10px;max-width:640px;width:92vw;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}
dialog h2{margin-top:0}.rules li{margin-bottom:5px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}.grid label{display:flex;flex-direction:column;font-size:12px}
.pr{display:flex;align-items:center;gap:6px;margin:3px 0}.pr input{flex:1;padding:4px}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.ld input{display:block;font-size:11px}
@media (max-width:900px){
 #main{flex-direction:column}
 #mapwrap{flex:0 0 52vh}
 #side{flex:1 1 auto;border-left:0;border-top:1px solid var(--line)}
}
</style>
</head>
<body>
<div id="app">
 <header>
  <h1>Eurobaron &middot; playtest</h1><span id="round"></span><span class="sp"></span>
  <label>Bots <select id="spd"><option value="120">fast</option><option value="650">normal</option><option value="1300">slow</option></select></label>
  <label><input type="checkbox" id="fol"> follow</label>
  <label><input type="checkbox" id="man"> dice by hand</label>
  <label><input type="checkbox" id="stp"> click each pip</label>
  <label><input type="checkbox" id="hm"> home triangles</label>
  <label><input type="checkbox" id="tg"> rail codes</label>
  <button class="b" id="bnew">New</button><button class="b" id="bsave">Save file</button><button class="b" id="brules">Rules</button>
 </header>
 <div id="main">
  <section id="mapwrap">
   <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
   <div id="tip" hidden></div>
   <div class="mapctl"><button id="zin" title="Zoom in">+</button><button id="zout" title="Zoom out">&minus;</button><button id="zall" title="Whole map">&#8962;</button><button id="znow" title="Centre on the player">&#9678;</button></div>
  </section>
  <aside id="side">
   <div class="panel" id="players"></div>
   <div class="panel"><div id="actions"></div><div id="dicebox" style="margin-top:6px"></div></div>
   <div class="panel"><b>Rails</b> <span class="muted">(tap a row to find it on the map)</span><div id="rails"></div></div>
   <div class="panel"><b>Log</b><div id="log"></div></div>
  </aside>
 </div>
</div>
<dialog id="dlg"></dialog>
<script src="data-eurobaron.js"></script>
<script src="engine.js"></script>
<script src="app.js"></script>
</body>
</html>
